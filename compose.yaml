# Local services for development and tests. Start with:
#   docker compose up -d db
# The credentials are for this local container only and never used anywhere else.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: devkit
      POSTGRES_PASSWORD: devkit
      POSTGRES_DB: devkit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devkit"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - devkit-db:/var/lib/postgresql/data

volumes:
  devkit-db:
