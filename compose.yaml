# Local services for development and tests. Start with:
#   docker compose up -d db
# The credentials are for this local container only and never used anywhere else.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mechframe
      POSTGRES_PASSWORD: mechframe
      POSTGRES_DB: mechframe
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mechframe"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      # A new volume since the rename (2026-11-18, decision 0034): Postgres makes its
      # role only when it sets a volume up, so the old devkit-db has no mechframe
      # role. It held only throwaway test databases. Compose named it after this
      # folder: list it with `docker volume ls -f name=devkit-db`, then remove that
      # one by its exact name (here `docker volume rm ai-devkit_devkit-db`).
      - mechframe-db:/var/lib/postgresql/data

volumes:
  mechframe-db:
