# Local services for development and tests. Start with:
#   docker compose up -d db
# The credentials are for this local container only and never used anywhere else.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mechframe
      POSTGRES_PASSWORD: mechframe
      POSTGRES_DB: mechframe
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mechframe"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - mechframe-db:/var/lib/postgresql/data

volumes:
  mechframe-db:
