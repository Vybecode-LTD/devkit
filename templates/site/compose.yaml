# A local Postgres for development and the tests. Start with:
#   docker compose up -d db
# The credentials are for this local container only and never used anywhere else.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: site
      POSTGRES_PASSWORD: site
      POSTGRES_DB: site
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - site-db:/var/lib/postgresql/data

volumes:
  site-db:
