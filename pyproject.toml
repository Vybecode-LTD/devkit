# The MechFrame repo's Python tooling. MechFrame isn't installed as a package: sites
# copy the kernel and modules in (decision 0002). This file configures the dev tools,
# whose dependencies live in requirements.in and requirements-dev.in, and the CLI,
# the one part that is installed: `dependencies` below is what it imports.

[project]
name = "mechframe"
version = "0.0.0"
description = "MechFrame: reusable website modules for AI agents (dev environment only)"
requires-python = ">=3.12"
# What the CLI imports (Codex on #91). The pinned requirements hold it, so the install
# below fetches nothing unpinned (SPEC 15; CodeRabbit on #91).
dependencies = ["jsonschema>=4.23"]

# The CLI (cli/mechframe/, K5) is the one part installed: `python -m pip install --no-deps --no-build-isolation -e .`,
# after the pinned requirements (setuptools among them),
# gives `mechframe` and `mf`, run from this checkout (it copies from it).
[project.scripts]
mechframe = "mechframe.__main__:main"
mf = "mechframe.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "cli"}
packages = ["mechframe"]

[tool.uv]
package = false

# --- tests -------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["kernel/tests", "tests", "modules", "cli/tests"]
# kernel/backend makes `import kernel` work; the repo root makes `harness` and
# `tools` importable, and cli `mechframe`. conftest.py adds every modules/*/backend.
pythonpath = ["kernel/backend", ".", "cli"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
markers = [
    "db: needs the test Postgres (compose.yaml); skipped when it isn't running, unless MECHFRAME_REQUIRE_DB=1",
    "storage_live: needs a real S3-compatible store (TEST_STORAGE_*, kernel/tests/test_storage_live.py); skipped when none is set",
]
filterwarnings = ["error", "ignore::DeprecationWarning:passlib.*"]
norecursedirs = ["node_modules", ".venv", "_template", "templates", "dist"]

[tool.coverage.run]
source = ["kernel/backend/kernel", "harness", "tools", "cli/mechframe"]
branch = true
# SQLAlchemy's async layer runs on greenlets: without this, lines after a
# database await inside a request go unmeasured.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
precision = 2
skip_empty = true
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# --- lint and format -----------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["node_modules", "modules/_template", "templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "C4", "SIM", "PT"]
# E501: Black owns line length.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use made-up secrets and local URLs.
"**/tests/**" = ["S101", "S105", "S106", "S311"]
"conftest.py" = ["S105", "S106"]
# Alembic migrations are generated in a fixed shape.
"**/migrations/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant as argument defaults.
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.Cookie", "fastapi.Security",
  # The kernel's access dependency factories, which routes call inside Depends().
  "kernel.require_permission", "kernel.require_owner_or", "kernel.require_recent_auth",
  "kernel.auth.dependencies.require_permission", "kernel.auth.dependencies.require_owner_or",
  "kernel.auth.dependencies.require_recent_auth",
]

[tool.ruff.lint.isort]
known-first-party = ["kernel", "harness", "tools", "mechframe"]

# --- types ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "kernel/backend,cli"
# Spec section 16: mypy strict. Every module's backend package too (its name
# is the module's id), so the strict flag is set for everything checked.
files = ["kernel/backend/kernel", "modules/*/backend", "harness", "tools", "cli/mechframe"]
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["alembic.*", "jsonschema.*", "boto3.*", "botocore.*", "asyncpg.*"]
ignore_missing_imports = true
